flow-wrap:anywhere}.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.media{display:grid;gap:2px;border-radius:16px;overflow:hidden;background:var(--line);height:240px;grid-template-columns:1fr}.media.n2,.media.n3,.media.n4{grid-template-columns:1fr 1fr}.media.n3,.media.n4{grid-template-rows:1fr 1fr}.media.n3 .tile:first-child{grid-row:span 2}.tile{position:relative;min-height:0;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover;display:block}.play{position:absolute;inset:0;display:grid;place-items:center}.play span{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:#0f1419b3;color:white;font-size:26px}.footer{display:flex;justify-content:space-between;gap:8px;color:var(--muted);margin-top:14px;font-size:12px}.metric{display:flex;align-items:center;gap:5px}.metric svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}.featured-title{display:flex;justify-content:space-between;align-items:center}.featured{max-width:620px;margin:auto}.status{text-align:center;padding:28px;color:var(--muted)}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#15202b;--fg:#e7e9ea;--muted:#8b98a5;--line:#2f3336}}@media(max-width:500px){.bar,main{padding:14px}.stats{gap:14px}.controls>*{max-width:100%}}
</style></head><body><header><div class="bar"><h1>Xいいねビューア</h1><div id="account" class="identity"></div></div></header><main><section id="landing" class="landing" hidden><h2>好きな投稿を、もう一度。</h2><p id="intro">Xのいいねを見やすく並べて楽しもう。</p><a id="login" class="button primary" href="/login">Xでログイン</a></section><div id="status" class="status" role="status" aria-live="polite">読み込み中…</div><section id="app" hidden><div class="featured-title"><h2>今日の一枚</h2><button id="shuffle">シャッフル</button></div><div id="featured" class="featured"></div><div class="controls"><input id="search" type="search" placeholder="投稿を検索" aria-label="投稿を検索"><select id="authors" aria-label="投稿者"><option value="">すべての投稿者</option></select><div class="segments" aria-label="並び順"><button data-sort="liked" aria-pressed="true">いいね順</button><button data-sort="new" aria-pressed="false">新しい順</button><button data-sort="popular" aria-pressed="false">人気順</button></div></div><div id="stats" class="stats"></div><div id="posts" class="columns"></div></section></main>

//picsum.photos/seed/16/600/400"}]}, {"id": "2000000000000000004", "text": "波の音に癒される午後。動画でひと休み。 #海", "created_at": "2026-10-27T09:00:00Z", "metrics": {"reply": 12, "repost": 48, "like": 411, "view": 6436}, "author": {"name": "喫茶ひなた", "username": "hinata_cafe", "avatar": "https://picsum.photos/seed/avatar2/600/400"}, "media": [{"type": "video", "url": "https://picsum.photos/seed/17/600/400"}]}, {"id": "2000000000000000005", "text": "アイデアは、余白から。\n文字だけの投稿も大切に。 $DESIGN", "created_at": "2026-10-26T09:00:00Z", "metrics": {"reply": 15, "repost": 60, "like": 274, "view": 7670}, "author": {"name": "デザイン日記", "username": "design_note", "avatar": "https://picsum.photos/seed/avatar3/600/400"}, "media": []}, {"id": "2000000000000000006", "text": "今日のコーヒーと、読みかけの本。\n#喫茶店", "created_at": "2026-10-25T09:00:00Z", "metrics": {"reply": 18, "repost": 72, "like": 137, "view": 8904}, "author": {"name": "旅するあお", "username": "ao_travel", "avatar": "https://picsum.photos/seed/avatar1/600/400"}, "media": [{"type": "photo", "url": "https://picsum.photos/seed/25/600/400"}]}]};
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function richText(text) {
  const pattern = /https?:\/\/[^\s<>]+|[#@＃＠$＄][\p{L}\p{N}_]+/gu;
  let result = '', last = 0;
  for (const match of String(text || '').matchAll(pattern)) {
    result += escapeHTML(text.slice(last, match.index));
    const token = match[0];
    let href;
    if (/^https?:/.test(token)) href = token;
    else if (/^[@＠]/.test(token)) href = 'https://x.com/' + encodeURIComponent(token.slice(1));
    else href = 'https://x.com/search?q=' + encodeURIComponent(token);
    result += '<a target="_blank" rel="noopener noreferrer" href="' + escapeHTML(href) + '">' + escapeHTML(token) + '</a>';
    last = match.index + token.length;
  }
  return result + escapeHTML(String(text || '').slice(last));
}
const paths = {reply:'M20 11a8 8 0 0 1-8 8H5l-3 3v-10a9 9 0 1 1 18-1Z',repost:'m4 8 4-4 4 4M8 4v12h12m0 0-4 4m4-4-4-4',like:'M12 21 3 12C-3 4 7-1 12 6c5-7 15-2 9 6Z',view:'M4 21V11m6 10V3m6 18V8m6 13V5'};

  const label = Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric'}).format(date);

}
function shuffle() {
 const candidates = posts.filter(p => p.media?.length && p.id !== featuredId);
 const post = candidates[Math.floor(Math.random()*candidates.length)] || posts.find(p => p.media?.length);
 featuredId = post?.id;
 $('featured').innerHTML = post ? card(post) : '<p class="muted">メディア付きの投稿はありません。</p>';
 $('shuffle').disabled = !post;
}
function render() {
 const query = $('search').value.toLocaleLowerCase(), author = $('authors').value;
 const filtered = posts.filter(p => (!author || p.author.username === author) && (p.text + ' ' + p.author.name + ' ' + p.author.username).toLocaleLowerCase().includes(query));
 if(sort === 'new') filtered.sort((a,b) => new Date(b.created_at)-new Date(a.created_at));

}

 if(window.__SETUP_REQUIRED__) {$('status').hidden=true;$('landing').hidden=false;$('intro').textContent='セットアップが必要です。X_CLIENT_ID、X_CLIENT_SECRET、SESSION_SECRET と KV を設定してください。';$('login').hidden=true;return;}
